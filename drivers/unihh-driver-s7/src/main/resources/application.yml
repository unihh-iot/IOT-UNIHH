server:
  port: 28012

spring:
  application:
    name: unihh-driver-s7

emqx:
  server-uri: ${EMQX_SERVER_URI:tcp://127.0.0.1:1883}
  username: ${EMQX_USERNAME:unihh}
  password: ${EMQX_PASSWORD:unihh}
  client-id-prefix: ${EMQX_CLIENT_ID_PREFIX:unihh-driver-s7}
  clean-session: ${EMQX_CLEAN_SESSION:true}
  keep-alive-interval: ${EMQX_KEEP_ALIVE:30}
  connection-timeout: ${EMQX_CONNECT_TIMEOUT:10}
  automatic-reconnect: ${EMQX_AUTO_RECONNECT:true}
  qos: ${EMQX_QOS:1}

admin:
  server-url: ${ADMIN_SERVER_URL:http://localhost:28001}

s7:
  driver:
    code: ${S7_DRIVER_CODE:s7-driver}
    name: ${S7_DRIVER_NAME:西门子 S7 工业协议驱动}
    service-url: ${S7_DRIVER_SERVICE_URL:http://localhost:28012}
    description: ${S7_DRIVER_DESC:支持西门子 S7-200/300/400/1200/1500 PLC 工业以太网 ISO-on-TCP (TPKT/COTP) 协议点位读写与解析}
    version: "2.0.0"
    params:
      - key: host
        name: "PLC IP地址"
        dataType: STRING
        required: true
        defaultValue: "192.168.1.200"
      - key: port
        name: "端口号"
        dataType: INT
        required: true
        defaultValue: "102"
      - key: rack
        name: "机架号 (Rack)"
        dataType: INT
        required: true
        defaultValue: "0"
      - key: slot
        name: "插槽号 (Slot)"
        dataType: INT
        required: true
        defaultValue: "1"
      - key: plcType
        name: "PLC 型号"
        dataType: SELECT
        required: false
        defaultValue: "S7-1200"
        description: "西门子 S7 系列控制器型号 (自动适配机架与插槽)"
        options:
          - label: "S7-1200 (默认 Rack 0, Slot 1)"
            value: "S7-1200"
          - label: "S7-1500 (默认 Rack 0, Slot 1)"
            value: "S7-1500"
          - label: "S7-300 (默认 Rack 0, Slot 2)"
            value: "S7-300"
          - label: "S7-400 (默认 Rack 0, Slot 2)"
            value: "S7-400"
          - label: "S7-200 SMART (默认 Rack 0, Slot 1)"
            value: "S7-200-SMART"
      - key: byteOrder
        name: "寄存器字节序"
        dataType: SELECT
        required: false
        defaultValue: "ABCD"
        description: "32位/64位整型与浮点数在S7数据块中的存储排列顺序 (推荐ABCD)"
        options:
          - label: "ABCD (西门子原生标准大端模式 / Big-Endian)"
            value: "ABCD"
          - label: "CDAB (32位小端字大端字节)"
            value: "CDAB"
          - label: "DCBA (完全小端模式 / Little-Endian)"
            value: "DCBA"
          - label: "BADC (字节交换模式 / Byte Swap)"
            value: "BADC"
          - label: "AB (16位标准大端)"
            value: "AB"
          - label: "BA (16位字节交换)"
            value: "BA"
          - label: "ABCDEFGH (64位标准大端)"
            value: "ABCDEFGH"
          - label: "GHEFCDAB (64位双字交换)"
            value: "GHEFCDAB"
          - label: "HGFEDCBA (64位完全小端)"
            value: "HGFEDCBA"
          - label: "BADCFEHG (64位字节交换)"
            value: "BADCFEHG"

logging:
  level:
    root: INFO
    com.unihh.iot.driver.s7: DEBUG
