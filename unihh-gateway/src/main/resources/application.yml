server:
  port: 28000

spring:
  application:
    name: unihh-gateway

unihh:
  services:
    admin-service:
      host: ${UNIHH_ADMIN_HOST:127.0.0.1}
      port: ${UNIHH_ADMIN_PORT:28001}
      grpc-port: ${UNIHH_ADMIN_GRPC_PORT:29001}
    data-service:
      host: ${UNIHH_DATA_HOST:127.0.0.1}
      port: ${UNIHH_DATA_PORT:28002}
      grpc-port: ${UNIHH_DATA_GRPC_PORT:29002}
    protocol-service:
      host: ${UNIHH_PROTOCOL_HOST:127.0.0.1}
      port: ${UNIHH_PROTOCOL_PORT:28003}
      grpc-port: ${UNIHH_PROTOCOL_GRPC_PORT:29003}
