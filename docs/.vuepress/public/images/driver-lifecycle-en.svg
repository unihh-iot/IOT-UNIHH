<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="1040" height="620" rx="16" fill="#f7f9fd"/>
  <rect x="0.5" y="0.5" width="1039" height="619" rx="15.5" fill="none" stroke="#dbe4f5"/>

  <!-- Actors -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="92" y="20" width="216" height="42" rx="10" fill="#f0f6ff" stroke="#bcd4fb"/>
    <text x="200" y="46" fill="#1e6fff">Driver Service</text>
    <rect x="412" y="20" width="216" height="42" rx="10" fill="#ebf9f3" stroke="#b8e6d2"/>
    <text x="520" y="46" fill="#007a4d">EMQX Broker</text>
    <rect x="732" y="20" width="216" height="42" rx="10" fill="#f5f1ff" stroke="#d8c8fb"/>
    <text x="840" y="46" fill="#6d28d9">Admin Center unihh-admin</text>
  </g>

  <g stroke="#c4d2e8" stroke-width="1.2" stroke-dasharray="4 5">
    <line x1="200" y1="62" x2="200" y2="596"/>
    <line x1="520" y1="62" x2="520" y2="596"/>
    <line x1="840" y1="62" x2="840" y2="596"/>
  </g>

  <!-- 1. setWill -->
  <g>
    <line x1="200" y1="102" x2="512" y2="102" stroke="#1e6fff" stroke-width="1.8"/>
    <path d="M506 97 L516 102 L506 107 Z" fill="#1e6fff"/>
    <text x="356" y="94" font-size="12" fill="#1b2a4a" text-anchor="middle" font-weight="600">1. setWill (LWT will message)</text>
    <text x="560" y="106" font-size="11" fill="#5a6b8c">register offline will · retained=true</text>
  </g>

  <!-- 2. connect -->
  <g>
    <line x1="200" y1="140" x2="512" y2="140" stroke="#1e6fff" stroke-width="1.8"/>
    <path d="M506 135 L516 140 L506 145 Z" fill="#1e6fff"/>
    <text x="356" y="132" font-size="12" fill="#1b2a4a" text-anchor="middle" font-weight="600">2. connect()</text>
  </g>

  <!-- 3. publish ONLINE -->
  <g>
    <line x1="200" y1="176" x2="512" y2="176" stroke="#1e6fff" stroke-width="1.8"/>
    <path d="M506 171 L516 176 L506 181 Z" fill="#1e6fff"/>
    <text x="356" y="168" font-size="12" fill="#1b2a4a" text-anchor="middle" font-weight="600">3. publish (ONLINE)</text>
    <line x1="528" y1="176" x2="832" y2="176" stroke="#007a4d" stroke-width="1.8"/>
    <path d="M826 171 L836 176 L826 181 Z" fill="#007a4d"/>
    <text x="680" y="192" font-size="11" fill="#5a6b8c" text-anchor="middle">driver online state synced instantly</text>
  </g>

  <!-- 4. register + config -->
  <g>
    <line x1="200" y1="226" x2="512" y2="226" stroke="#1e6fff" stroke-width="1.8"/>
    <path d="M506 221 L516 226 L506 231 Z" fill="#1e6fff"/>
    <text x="356" y="218" font-size="12" fill="#1b2a4a" text-anchor="middle" font-weight="600">4. register (iot/driver/register)</text>
    <line x1="528" y1="226" x2="832" y2="226" stroke="#007a4d" stroke-width="1.8"/>
    <path d="M826 221 L836 226 L826 231 Z" fill="#007a4d"/>
    <text x="680" y="242" font-size="11" fill="#5a6b8c" text-anchor="middle">registration written / updated</text>
    <line x1="840" y1="262" x2="528" y2="262" stroke="#6d28d9" stroke-width="1.8"/>
    <path d="M534 257 L524 262 L534 267 Z" fill="#6d28d9"/>
    <text x="684" y="254" font-size="12" fill="#1b2a4a" text-anchor="middle" font-weight="600">pushes configured devices &amp; points (config/update)</text>
    <line x1="512" y1="262" x2="208" y2="262" stroke="#007a4d" stroke-width="1.8"/>
    <path d="M214 257 L204 262 L214 267 Z" fill="#007a4d"/>
    <text x="360" y="278" font-size="11" fill="#5a6b8c" text-anchor="middle">iot/driver/{code}/device/config</text>
  </g>

  <!-- 5. heartbeat -->
  <g>
    <rect x="60" y="298" width="150" height="24" rx="12" fill="#eef3fb" stroke="#dbe4f5"/>
    <text x="135" y="314" font-size="11.5" fill="#5a6b8c" text-anchor="middle">heartbeat every 5s</text>
    <line x1="200" y1="338" x2="512" y2="338" stroke="#1e6fff" stroke-width="1.8"/>
    <path d="M506 333 L516 338 L506 343 Z" fill="#1e6fff"/>
    <text x="356" y="330" font-size="12" fill="#1b2a4a" text-anchor="middle" font-weight="600">5. heartbeat (iot/driver/heartbeat)</text>
    <line x1="528" y1="338" x2="832" y2="338" stroke="#007a4d" stroke-width="1.8"/>
    <path d="M826 333 L836 338 L826 343 Z" fill="#007a4d"/>
    <text x="680" y="354" font-size="11" fill="#5a6b8c" text-anchor="middle">refreshes watchdog timestamp</text>
  </g>

  <!-- 6. LWT failure branch -->
  <g>
    <rect x="24" y="386" width="992" height="128" rx="12" fill="#fff5f5" stroke="#f5c6c6"/>
    <rect x="24" y="386" width="6" height="128" rx="3" fill="#dc2626"/>
    <text x="52" y="412" font-size="14" font-weight="700" fill="#b91c1c">Abnormal disconnect (power loss / process crash)</text>
    <g>
      <circle cx="200" cy="440" r="7" fill="none" stroke="#dc2626" stroke-width="2.4"/>
      <line x1="195" y1="435" x2="205" y2="445" stroke="#dc2626" stroke-width="2.4"/>
      <line x1="205" y1="435" x2="195" y2="445" stroke="#dc2626" stroke-width="2.4"/>
      <text x="200" y="470" font-size="11.5" fill="#b91c1c" text-anchor="middle">connection lost</text>
    </g>
    <line x1="216" y1="440" x2="512" y2="440" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
    <path d="M506 435 L516 440 L506 445 Z" fill="#dc2626"/>
    <text x="364" y="432" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="600">6. Broker publishes the LWT will</text>
    <text x="364" y="456" font-size="11" fill="#b91c1c" text-anchor="middle">iot/driver/{code}/status</text>
    <line x1="528" y1="440" x2="832" y2="440" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
    <path d="M826 435 L836 440 L826 445 Z" fill="#dc2626"/>
    <text x="680" y="470" font-size="11" fill="#b91c1c" text-anchor="middle">driver marked offline · devices cascaded offline</text>
  </g>

  <!-- 7. Watchdog -->
  <g>
    <rect x="732" y="534" width="216" height="42" rx="10" fill="#fdf3e3" stroke="#f2ddb2"/>
    <text x="840" y="552" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Watchdog patrol</text>
    <text x="840" y="568" font-size="11" fill="#b45309" text-anchor="middle">offline after 15s without heartbeat</text>
    <text x="480" y="560" font-size="11" fill="#8a99b8" text-anchor="middle">LWT plus watchdog double safety net · the platform detects driver loss within seconds</text>
  </g>
</svg>
