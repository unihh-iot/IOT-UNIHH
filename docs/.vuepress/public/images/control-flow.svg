<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="1040" height="400" rx="16" fill="#f7f9fd"/>
  <rect x="0.5" y="0.5" width="1039" height="399" rx="15.5" fill="none" stroke="#dbe4f5"/>

  <!-- ===== 主链路 6 节点 ===== -->
  <g text-anchor="middle">
    <rect x="24" y="170" width="140" height="64" rx="10" fill="#ffffff" stroke="#dbe4f5"/>
    <text x="94" y="196" font-size="13" font-weight="700" fill="#1b2a4a">前端 / 业务方</text>
    <text x="94" y="214" font-size="10.5" fill="#8a99b8">点位反写请求</text>

    <rect x="192" y="170" width="140" height="64" rx="10" fill="#f5f1ff" stroke="#d8c8fb"/>
    <text x="262" y="192" font-size="13" font-weight="700" fill="#6d28d9">统一网关</text>
    <text x="262" y="208" font-size="10.5" fill="#8a99b8">unihh-gateway · :28000</text>
    <text x="262" y="222" font-size="10.5" fill="#8a99b8">路由与鉴权</text>

    <rect x="360" y="170" width="140" height="64" rx="10" fill="#f5f1ff" stroke="#d8c8fb"/>
    <text x="430" y="192" font-size="13" font-weight="700" fill="#6d28d9">管理中心</text>
    <text x="430" y="208" font-size="10.5" fill="#8a99b8">unihh-admin · :28001</text>
    <text x="430" y="222" font-size="10.5" fill="#8a99b8">构建控制指令</text>

    <rect x="528" y="170" width="140" height="64" rx="10" fill="#ebf9f3" stroke="#b8e6d2"/>
    <text x="598" y="192" font-size="13" font-weight="700" fill="#007a4d">EMQX 总线</text>
    <text x="598" y="208" font-size="10.5" fill="#8a99b8">iot/driver/{code}/cmd</text>
    <text x="598" y="222" font-size="10.5" fill="#8a99b8">专属主题定向</text>

    <rect x="696" y="170" width="140" height="64" rx="10" fill="#f0f6ff" stroke="#bcd4fb"/>
    <text x="766" y="192" font-size="13" font-weight="700" fill="#1e6fff">驱动服务</text>
    <text x="766" y="208" font-size="10.5" fill="#8a99b8">getChannelLock 排队</text>
    <text x="766" y="222" font-size="10.5" fill="#8a99b8">writePoint(...) 写入</text>

    <rect x="864" y="170" width="152" height="64" rx="10" fill="#ffffff" stroke="#dbe4f5"/>
    <text x="940" y="196" font-size="13" font-weight="700" fill="#1b2a4a">物理设备 / PLC</text>
    <text x="940" y="214" font-size="10.5" fill="#8a99b8">寄存器改写</text>
  </g>

  <!-- 主链路箭头 -->
  <g stroke="#94a8c9" stroke-width="1.8">
    <line x1="164" y1="202" x2="184" y2="202"/>
    <line x1="332" y1="202" x2="352" y2="202"/>
    <line x1="500" y1="202" x2="520" y2="202"/>
    <line x1="668" y1="202" x2="688" y2="202"/>
    <line x1="836" y1="202" x2="856" y2="202"/>
  </g>
  <g fill="#94a8c9">
    <path d="M180 197 L190 202 L180 207 Z"/>
    <path d="M348 197 L358 202 L348 207 Z"/>
    <path d="M516 197 L526 202 L516 207 Z"/>
    <path d="M684 197 L694 202 L684 207 Z"/>
    <path d="M852 197 L862 202 L852 207 Z"/>
  </g>

  <!-- 顶部调用链说明 -->
  <g>
    <rect x="330" y="112" width="380" height="26" rx="13" fill="#eef3fb" stroke="#dbe4f5"/>
    <text x="520" y="129" font-size="11.5" fill="#5a6b8c" text-anchor="middle">REST 下发（JWT 鉴权） → MQTT 专属主题 → 驱动执行</text>
    <line x1="520" y1="138" x2="520" y2="162" stroke="#c4d2e8" stroke-width="1.1" stroke-dasharray="3 4"/>
  </g>

  <!-- 通道锁说明 -->
  <g>
    <rect x="640" y="272" width="252" height="52" rx="10" fill="#f0f6ff" stroke="#bcd4fb"/>
    <text x="766" y="292" font-size="12" font-weight="700" fill="#1e6fff" text-anchor="middle">通道级公平互斥锁</text>
    <text x="766" y="310" font-size="10.5" fill="#5a6b8c" text-anchor="middle">同一通道读写串行执行，与采集轮询互不干扰</text>
    <line x1="766" y1="234" x2="766" y2="264" stroke="#c4d2e8" stroke-width="1.1" stroke-dasharray="3 4"/>
  </g>

  <!-- RS485 提示 -->
  <g>
    <rect x="864" y="272" width="152" height="52" rx="10" fill="#fdf3e3" stroke="#f2ddb2"/>
    <text x="940" y="292" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">RS485 半双工总线</text>
    <text x="940" y="310" font-size="10.5" fill="#b45309" text-anchor="middle">指令在锁内排队，杜绝粘包错帧</text>
    <line x1="940" y1="234" x2="940" y2="264" stroke="#e4cba0" stroke-width="1.1" stroke-dasharray="3 4"/>
  </g>

  <!-- 执行结果回流 -->
  <g>
    <rect x="24" y="272" width="560" height="52" rx="10" fill="#ebf9f3" stroke="#b8e6d2"/>
    <text x="304" y="292" font-size="12" font-weight="700" fill="#007a4d" text-anchor="middle">执行结果原路返回：驱动 → EMQX → 管理中心 → 前端实时展示</text>
    <text x="304" y="310" font-size="10.5" fill="#5a6b8c" text-anchor="middle">参数快照、耗时与成败写入【日志审计 → 设备反控服务下发日志】</text>
    <path d="M24 258 L24 248 L864 248" stroke="#7fc4a7" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/>
    <path d="M30 252 L22 262 L34 264 Z" fill="#7fc4a7"/>
  </g>

  <text x="520" y="366" font-size="11" fill="#8a99b8" text-anchor="middle">读写模式为 RW 的属性点位与物模型服务（Service）才可被反控 · 全链路审计可追溯</text>
</svg>
